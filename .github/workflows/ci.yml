name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 20
    env:
      OLTERRA_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      OLTERRA_TEST_NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # Los servicios de Actions no aceptan argumentos; NATS necesita -js.
      - name: NATS con JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.11-alpine -js
      - run: pip install -e ".[dev]"
      - name: Estilo
        run: |
          ruff check src tests migrations
          ruff format --check src tests migrations
      - name: Tipos
        run: mypy
      - name: Pruebas (unitarias, SSH contra el simulador, PostgreSQL y NATS)
        run: pytest -q

  interfaz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Estilo
        run: |
          npm run lint
          npm run format:check
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Build
        run: npx vite build

  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: La imagen construye y trae los comandos
        run: |
          docker build -t olterra:ci .
          docker run --rm olterra:ci olterra-conciliar --help
          docker run --rm olterra:ci olterra-executor --help

  # El despliegue de producción, de punta a punta, como en el servidor: ./olterra.sh instalar
  # con dominio localhost (Caddy usa su CA interna), un ISP, la demo, respaldo y restauración.
  despliegue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/produccion
    env:
      OLTERRA_CONSTRUIR: "1"
      OLTERRA_VERSION: ci
    steps:
      - uses: actions/checkout@v4
      - name: Scripts (shellcheck)
        run: shellcheck olterra.sh respaldo.sh
      - name: Instalar
        run: ./olterra.sh instalar localhost
      - name: Humo
        run: |
          set -euo pipefail
          base=https://localhost
          curl -fsSk "$base/health" | grep -q '"database":"ok"'
          curl -fsSk "$base/health" | grep -q '"nats":"conectado"'
          curl -fsSk "$base/" | grep -q '<div id="app">'
          curl -fsSk "$base/olts/una-ruta-de-la-spa" | grep -q '<div id="app">'
          curl -fsSkI "$base/" | grep -qi '^content-security-policy:'
          test "$(curl -sSk -o /dev/null -w '%{http_code}' "$base/v1/me")" = 401
          test "$(curl -sSk -o /dev/null -w '%{http_code}' http://localhost/)" = 308
          llave=$(./olterra.sh isp isp-ci "ISP CI" | grep -oE 'olt_[0-9a-f]{32}_[0-9a-f]{32}_[A-Za-z0-9_-]{43}')
          curl -fsSk -H "Authorization: Bearer $llave" "$base/v1/me" | grep -q '"slug":"isp-ci"'
          curl -fsSk -X POST -H "Authorization: Bearer $llave" "$base/v1/reconciliations/demo"             | grep -q '"source":"demo"'
      - name: Respaldo y restauración
        run: |
          ./olterra.sh respaldo
          ./olterra.sh probar-respaldo
      - name: Actualizar sobre una instalación andando
        run: ./olterra.sh actualizar
      - name: Registros (si algo falló)
        if: failure()
        run: docker compose logs --no-color --tail 200
