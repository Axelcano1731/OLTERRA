[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "olterra"
version = "0.1.0"
description = "Gestión de OLT VSOL + mapa FTTH, amarrados al CRM del ISP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- API ----------------------------------------------------------------
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",  # archivos de la conciliación desde la interfaz
    # --- Inventario y mapa (PostgreSQL + PostGIS) ---------------------------
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "geoalchemy2>=0.15",
    # --- Mensajería con el ejecutor -----------------------------------------
    "nats-py>=2.9",
    # --- Conexión con los equipos -------------------------------------------
    "asyncssh>=2.18",
    "pysnmp>=7.1",
    "librouteros>=3.4",
    # --- Criptografía (bóveda, túnel, credenciales selladas) ----------------
    "cryptography>=43",
    # --- Integraciones y reportes -------------------------------------------
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
olterra-executor = "olterra.executor.worker:main"
olterra-capture = "olterra.capture.cli:main"
olterra-conciliar = "olterra.reconciliation.cli:main"
olterra-admin = "olterra.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
olterra = ["reconciliation/templates/*.j2", "py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Starlette avisa que su TestClient pasará a httpx2; no afecta las pruebas.
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
    "postgres: requieren PostgreSQL con PostGIS (OLTERRA_TEST_ADMIN_URL, superusuario)",
    "nats: requieren un nats-server con JetStream (OLTERRA_TEST_NATS_URL)",
]

[tool.coverage.run]
source = ["src/olterra"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "ASYNC"]
ignore = [
    "E501",     # la longitud de línea la controla el formateador
    "RUF001",   # los textos en español usan caracteres no ASCII de forma legítima
    "RUF002",
    "RUF003",
    "N818",     # CliTimeout o UnrecognizedOutput se leen mejor sin el sufijo Error
    "ASYNC109", # los tiempos máximos explícitos por paso son parte del diseño del ejecutor
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "S108"]  # assert y secretos de prueba son el idioma de pytest
"migrations/*" = ["S608"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["olterra"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
