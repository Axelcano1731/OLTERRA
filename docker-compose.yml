# Entorno de desarrollo completo. Las claves de aquí son de DESARROLLO.
# Producción: deploy/produccion/ (ver docs/DESPLIEGUE.md).
#
#   cp .env.example .env        # y completar las llaves (ver MANUAL_DESARROLLADOR)
#   docker compose up -d db nats
#   docker compose run --rm migrate
#   docker compose up -d api executor
#
# VictoriaMetrics entra con el sondeo de potencias y tráfico (fase 1).

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-olterra.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olterra"]
      interval: 5s
      retries: 20

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      OLTERRA_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://olterra_owner:olterra_owner@db:5432/olterra
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  api:
    build: .
    env_file: .env
    environment:
      OLTERRA_DATABASE_URL: postgresql+asyncpg://olterra_app:olterra_app@db:5432/olterra
      OLTERRA_NATS_URL: nats://nats:4222
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started

  executor:
    build: .
    command: ["olterra-executor"]
    env_file: .env
    environment:
      OLTERRA_NATS_URL: nats://nats:4222
    depends_on:
      - nats

volumes:
  pgdata:
  natsdata:
